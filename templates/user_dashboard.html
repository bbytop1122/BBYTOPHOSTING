<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - CloudVPS Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="h-full text-slate-100 flex flex-col bg-slate-950 selection:bg-indigo-500 selection:text-white">
    <!-- Navbar -->
    <header class="w-full border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-server text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight text-white">CloudVPS <span class="text-indigo-400 font-normal">Console</span></h1>
                    <p id="userSubtitle" class="text-xs text-slate-400">Loading user session...</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="openCreateModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm rounded-xl shadow-lg shadow-indigo-600/20 transition flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Deploy New VPS</span>
                </button>
                <div class="h-6 w-px bg-slate-800"></div>
                <button onclick="logout()" class="px-3 py-2 text-sm text-slate-400 hover:text-rose-400 transition" title="Logout">
                    <i class="fa-solid fa-right-from-bracket text-base"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8">
        <!-- Overview Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="p-6 rounded-2xl bg-slate-900/60 border border-slate-800/80">
                <div class="text-xs text-slate-400 uppercase tracking-wider mb-2">Total Instances</div>
                <div id="statTotalVps" class="text-3xl font-bold text-white">0</div>
            </div>
            <div class="p-6 rounded-2xl bg-slate-900/60 border border-slate-800/80">
                <div class="text-xs text-slate-400 uppercase tracking-wider mb-2">Running VPS</div>
                <div id="statRunningVps" class="text-3xl font-bold text-emerald-400">0</div>
            </div>
            <div class="p-6 rounded-2xl bg-slate-900/60 border border-slate-800/80">
                <div class="text-xs text-slate-400 uppercase tracking-wider mb-2">Allocated RAM</div>
                <div id="statRam" class="text-3xl font-bold text-indigo-400">0 GB</div>
            </div>
            <div class="p-6 rounded-2xl bg-slate-900/60 border border-slate-800/80">
                <div class="text-xs text-slate-400 uppercase tracking-wider mb-2">Total Storage</div>
                <div id="statDisk" class="text-3xl font-bold text-sky-400">0 GB</div>
            </div>
        </div>

        <!-- VPS Instances Section -->
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold text-white">Your Cloud Servers</h2>
            <button onclick="fetchVpsList()" class="text-xs text-indigo-400 hover:underline flex items-center space-x-1">
                <i class="fa-solid fa-rotate"></i>
                <span>Refresh Status</span>
            </button>
        </div>

        <div id="vpsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loaded dynamically -->
            <div class="p-8 text-center text-slate-500 col-span-full">Loading instances...</div>
        </div>
    </main>

    <!-- Create VPS Modal -->
    <div id="createModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-8 shadow-2xl relative">
            <button onclick="closeCreateModal()" class="absolute top-6 right-6 text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 class="text-xl font-bold text-white mb-2">Deploy Virtual Machine</h3>
            <p class="text-sm text-slate-400 mb-6">Configure your KVM instance or Docker container specs.</p>

            <form onsubmit="handleCreateVps(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">Instance Name</label>
                    <input type="text" id="vpsName" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500" placeholder="Production API Server">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">Operating System</label>
                        <select id="vpsOs" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500">
                            <option value="ubuntu-22.04">Ubuntu 22.04 LTS</option>
                            <option value="debian-12">Debian 12 Bookworm</option>
                            <option value="alpine-3.19">Alpine Linux 3.19</option>
                            <option value="docker-redis">Docker + Redis Runtime</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">Hypervisor Node</label>
                        <select id="vpsNode" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500">
                            <option value="node_1">US-East Node 01</option>
                            <option value="node_2">Europe Frankfurt Node 02</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">CPU Cores</label>
                        <select id="vpsCpu" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-white text-sm focus:outline-none focus:border-indigo-500">
                            <option value="1">1 vCPU</option>
                            <option value="2">2 vCPU</option>
                            <option value="4" selected>4 vCPU</option>
                            <option value="8">8 vCPU</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">RAM (GB)</label>
                        <select id="vpsRam" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-white text-sm focus:outline-none focus:border-indigo-500">
                            <option value="2">2 GB</option>
                            <option value="4">4 GB</option>
                            <option value="8" selected>8 GB</option>
                            <option value="16">16 GB</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">Disk (GB)</label>
                        <select id="vpsDisk" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-white text-sm focus:outline-none focus:border-indigo-500">
                            <option value="50">50 GB SSD</option>
                            <option value="100" selected>100 GB SSD</option>
                            <option value="250">250 GB NVMe</option>
                        </select>
                    </div>
                </div>
                <div id="createError" class="text-xs text-rose-400 hidden"></div>
                <div class="flex items-center justify-end space-x-3 pt-4">
                    <button type="button" onclick="closeCreateModal()" class="px-4 py-2.5 text-sm text-slate-400 hover:text-white transition">Cancel</button>
                    <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-600/20 transition">Deploy Instance</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
        &copy; 2026 CloudVPS Enterprise. Secure Virtualization Console.
    </footer>

    <script>
        let currentUser = null;
        try {
            currentUser = JSON.parse(localStorage.getItem('cloud_vps_user') || 'null');
        } catch (e) {}

        if (!currentUser) {
            window.location.href = '/';
        } else {
            document.getElementById('userSubtitle').innerText = `${currentUser.name} (${currentUser.email})`;
            fetchVpsList();
        }

        function logout() {
            try { localStorage.removeItem('cloud_vps_user'); } catch (e) {}
            window.location.href = '/';
        }

        function openCreateModal() {
            document.getElementById('createModal').classList.remove('hidden');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.add('hidden');
            document.getElementById('createError').classList.add('hidden');
        }

        async function fetchVpsList() {
            try {
                const res = await fetch(`/api/vps?userId=${currentUser.id}`);
                const data = await res.json();
                if (data.success) {
                    renderVps(data.vpsList);
                }
            } catch (err) {
                console.error("Failed to fetch VPS", err);
            }
        }

        function renderVps(list) {
            const container = document.getElementById('vpsContainer');
            if (!list || list.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full p-12 text-center bg-slate-900/40 border border-slate-800/80 rounded-2xl">
                        <div class="w-12 h-12 rounded-full bg-indigo-500/10 text-indigo-400 flex items-center justify-center mx-auto mb-4 text-xl">
                            <i class="fa-solid fa-server"></i>
                        </div>
                        <h3 class="font-semibold text-white mb-1">No Cloud Instances Found</h3>
                        <p class="text-sm text-slate-400 mb-6">Deploy your first virtual machine or container in seconds.</p>
                        <button onclick="openCreateModal()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl shadow-lg transition">Deploy Now</button>
                    </div>
                `;
                document.getElementById('statTotalVps').innerText = 0;
                document.getElementById('statRunningVps').innerText = 0;
                document.getElementById('statRam').innerText = '0 GB';
                document.getElementById('statDisk').innerText = '0 GB';
                return;
            }

            let totalVps = list.length;
            let runningVps = list.filter(v => v.status === 'running').length;
            let totalRam = list.reduce((acc, v) => acc + (v.ramGb || 0), 0);
            let totalDisk = list.reduce((acc, v) => acc + (v.diskGb || 0), 0);

            document.getElementById('statTotalVps').innerText = totalVps;
            document.getElementById('statRunningVps').innerText = runningVps;
            document.getElementById('statRam').innerText = totalRam + ' GB';
            document.getElementById('statDisk').innerText = totalDisk + ' GB';

            container.innerHTML = list.map(v => `
                <div class="p-6 rounded-2xl bg-slate-900/60 border border-slate-800/80 flex flex-col justify-between hover:border-slate-700 transition">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${v.status === 'running' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}">
                                <i class="fa-solid fa-circle text-[8px] mr-1.5"></i>${v.status.toUpperCase()}
                            </span>
                            <span class="text-xs font-mono text-slate-500">${v.id}</span>
                        </div>
                        <h3 class="font-bold text-white text-lg mb-1">${v.name}</h3>
                        <p class="text-xs font-mono text-indigo-400 mb-4">${v.ipAddress} &bull; ${v.hostname}</p>
                        
                        <div class="space-y-2 mb-6 text-xs text-slate-400">
                            <div class="flex justify-between">
                                <span>OS / Spec:</span>
                                <span class="text-white font-medium">${v.os} (${v.cpuCores} vCPU / ${v.ramGb}GB RAM)</span>
                            </div>
                            <div class="flex justify-between">
                                <span>Hypervisor Node:</span>
                                <span class="text-white font-medium">${v.nodeName}</span>
                            </div>
                            <div class="flex justify-between">
                                <span>CPU Load:</span>
                                <span class="text-white font-medium">${v.cpuUsage || 12.4}%</span>
                            </div>
                        </div>

                        <!-- Telemetry Progress -->
                        <div class="space-y-2 mb-6">
                            <div>
                                <div class="flex justify-between text-[11px] text-slate-400 mb-1">
                                    <span>RAM Usage</span>
                                    <span>${v.ramUsage || 34}%</span>
                                </div>
                                <div class="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden">
                                    <div class="h-full bg-indigo-500 rounded-full" style="width: ${v.ramUsage || 34}%"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between">
                        <button onclick="openTerminal('${v.id}')" class="px-3 py-2 bg-indigo-600/10 hover:bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 text-xs font-semibold rounded-lg transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-terminal"></i>
                            <span>Terminal</span>
                        </button>
                        <div class="flex items-center space-x-2">
                            <button onclick="vpsAction('${v.id}', '${v.status === 'running' ? 'stop' : 'start'}')" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition" title="${v.status === 'running' ? 'Stop' : 'Start'}">
                                <i class="fa-solid ${v.status === 'running' ? 'fa-stop text-amber-400' : 'fa-play text-emerald-400'} text-xs"></i>
                            </button>
                            <button onclick="vpsAction('${v.id}', 'restart')" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition" title="Restart">
                                <i class="fa-solid fa-rotate text-xs text-sky-400"></i>
                            </button>
                            <button onclick="deleteVps('${v.id}')" class="p-2 bg-slate-800 hover:bg-rose-900/40 text-slate-400 hover:text-rose-400 rounded-lg transition" title="Delete">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function handleCreateVps(e) {
            e.preventDefault();
            const name = document.getElementById('vpsName').value.trim();
            const os = document.getElementById('vpsOs').value;
            const nodeId = document.getElementById('vpsNode').value;
            const cpuCores = parseInt(document.getElementById('vpsCpu').value);
            const ramGb = parseInt(document.getElementById('vpsRam').value);
            const diskGb = parseInt(document.getElementById('vpsDisk').value);

            try {
                const res = await fetch('/api/vps/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser.id, userName: currentUser.name, name, os, nodeId, cpuCores, ramGb, diskGb })
                });
                const data = await res.json();
                if (data.success) {
                    closeCreateModal();
                    fetchVpsList();
                } else {
                    document.getElementById('createError').innerText = data.error || 'Failed to create VPS';
                    document.getElementById('createError').classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function vpsAction(vpsId, action) {
            try {
                await fetch('/api/vps/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vpsId, action })
                });
                fetchVpsList();
            } catch (err) {
                console.error(err);
            }
        }

        async function deleteVps(vpsId) {
            if (!confirm("Are you sure you want to terminate this VPS instance? All data will be permanently lost.")) return;
            try {
                await fetch('/api/vps/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vpsId })
                });
                fetchVpsList();
            } catch (err) {
                console.error(err);
            }
        }

        function openTerminal(vpsId) {
            window.location.href = `/terminal?vpsId=${vpsId}`;
        }
    </script>
</body>
</html>
